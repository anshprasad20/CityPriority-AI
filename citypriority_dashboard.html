<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#E9ECEF;--card:#FFFFFF;--ink:#1B2026;--mut:#4A5460;--line:#C9D0D8;--asphalt:#1F252B;--brand:#0A4DA2;--yellow:#F6C90E;--btxt:#FFFFFF;--red:#C8161D;--warn:#7A5800;--ok:#1B7A43;--chip:#F1F3F6;--wbg:#F6C90E;--wink:#1B2026;--hero:#B3151B}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161B;--card:#1B2128;--ink:#EDF0F3;--mut:#A9B3BE;--line:#35404B;--asphalt:#0C0F12;--brand:#6CA6FF;--yellow:#FFD21F;--btxt:#0C1A2E;--red:#FF7A7A;--warn:#FFD21F;--ok:#4ADE80;--chip:#232B34;--wbg:#FFD21F;--wink:#1B2026;--hero:#B3151B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161B;--card:#1B2128;--ink:#EDF0F3;--mut:#A9B3BE;--line:#35404B;--asphalt:#0C0F12;--brand:#6CA6FF;--yellow:#FFD21F;--btxt:#0C1A2E;--red:#FF7A7A;--warn:#FFD21F;--ok:#4ADE80;--chip:#232B34;--wbg:#FFD21F;--wink:#1B2026;--hero:#B3151B}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
:root{--ui:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,Arial,sans-serif;--display:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;line-height:1.15}h2{font:700 30px/1.1 var(--display);margin-bottom:14px}h3{font:700 16px/1.3 var(--display);letter-spacing:.01em;margin-bottom:8px}
a{color:var(--brand)}td a{font-weight:600}:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:6px;z-index:9}
/* header: asphalt strip with a road centre line */
header{position:relative;background:var(--asphalt);color:#fff;padding:14px 20px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:5px;background:repeating-linear-gradient(90deg,var(--yellow) 0 30px,transparent 30px 50px)}
header h1{font:700 27px/1.1 var(--display);color:#fff;letter-spacing:.01em}header small{color:#B9C2CC;flex:1;font-size:14px}.logo{flex:none}header h1.brand{margin:0;line-height:0}header h1.brand img{display:block;height:60px;width:auto;filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 2px 6px rgba(0,0,0,.35))}
header .bt.s{background:transparent;color:#fff;border-color:#8A95A1}
.warn{background:var(--wbg);color:var(--wink);padding:9px 20px;font-size:14px;font-weight:600}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:0;background:none;color:var(--ink);padding:12px 16px;font:600 16px/1.2 var(--display);cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--chip)}
nav button[aria-selected=true]{background:var(--brand);color:var(--btxt);box-shadow:inset 0 -4px 0 var(--yellow)}
main{max-width:1280px;margin:auto;padding:24px 20px 48px}
.g{display:grid;gap:16px}.k{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px}
.k>.c{background:none;border:0;border-top:5px solid var(--ink);border-radius:0;padding:10px 0 0}.k>.c.esc{border-left:0;border-top-color:var(--red)}
.kv{font:700 38px/1.1 var(--display);font-variant-numeric:lining-nums tabular-nums}.kl{color:var(--mut);font-size:13px}.red{color:var(--red)}
.mut{color:var(--mut)}.sm{font-size:12.5px}.esc{border-left:6px solid var(--red)}.amb{border-left:6px solid var(--warn)}
.b{display:inline-block;padding:2px 7px;border-radius:3px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.b.e{background:var(--red);border-color:var(--red);color:#fff}.b.h{color:var(--ok)}.b.m{color:var(--warn)}.b.l{color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select,button.bt{font:inherit;padding:8px 10px;border:1px solid var(--mut);border-radius:4px;background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=range]{accent-color:var(--brand)}
button.bt{cursor:pointer;background:var(--brand);color:var(--btxt);border-color:var(--brand);font-weight:700}button.bt:hover{filter:brightness(1.12)}
button.bt.s{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}th{font-weight:700;font-size:13px;color:var(--ink);border-bottom:2px solid var(--ink)}
th.r,td.r{text-align:right}
tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--chip)}tr.sep td{background:var(--asphalt);color:#fff;font-weight:700;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}.bar .n{width:130px;font-size:13px}.bar .t{flex:1;height:12px;background:var(--chip);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand)}.bar .v{width:150px;font-size:12.5px;text-align:right}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.hd h2{margin:0}
input[type=range]{width:100%;padding:0}.row{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.bar .t i{animation:grow .55s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{width:0}}
/* map */
.mapg{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.mw svg{min-height:560px}
.mw{position:relative}.mw svg{display:block;width:100%;height:auto;background:var(--chip)}.mw circle[data-id]{cursor:pointer}.mw circle[data-id]:hover{stroke:var(--ink);stroke-width:1.5}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:7px 10px;font-size:12.5px;line-height:1.45;z-index:5;width:210px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--mut)}.lg i{display:inline-block;border-radius:50%;vertical-align:-2px;margin-right:5px}
/* footer: asphalt band, labelled facts */
footer{position:relative;background:var(--asphalt);color:#C3CBD4;margin-top:24px;padding:26px max(20px,calc((100% - 1240px)/2)) 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 28px;font-size:13px;line-height:1.45}
footer::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--yellow) 0 30px,transparent 30px 50px)}
footer b{display:block;color:#fff;font:700 13px var(--display);letter-spacing:.02em;margin-bottom:2px}
/* hero: the one loud thing, a warning-sign panel */
.hero{position:relative;background:var(--hero);color:#fff;border-radius:4px;padding:30px 28px 36px;margin-bottom:24px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--yellow) 0 30px,transparent 30px 50px)}
.hero h2{font:700 clamp(32px,5.5vw,54px)/1.04 var(--display);margin:0 0 14px;max-width:22ch;letter-spacing:-.005em}.hero h2 .red{color:#fff}
.hero p{color:#fff}.hero :focus-visible{outline-color:#fff}
.cta{display:inline-block;background:var(--brand);color:var(--btxt);padding:12px 20px;border-radius:4px;text-decoration:none;font-weight:700}.cta:hover{filter:brightness(1.12)}
.hero .cta{background:var(--yellow);color:#1B2026}
.facts{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:26px}.fact{border-top:3px solid var(--yellow);padding-top:8px;line-height:1.4}.fact b{display:block;font:700 34px/1.1 var(--display);font-variant-numeric:lining-nums tabular-nums}
/* page-switch effects: the new page slides in from the side its tab sits on, and a road line is drawn under the tabs */
body{overflow-x:clip}nav{position:relative}
#app.go-r{animation:pgR .4s cubic-bezier(.2,.7,.2,1) both}#app.go-l{animation:pgL .4s cubic-bezier(.2,.7,.2,1) both}#app.go-f{animation:pgF .35s ease-out both}
@keyframes pgR{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes pgL{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@keyframes pgF{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--yellow) 0 30px,transparent 30px 50px);transform:scaleX(0);transform-origin:left;opacity:0;pointer-events:none}
nav.run::after{animation:sweep .7s ease-out}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}65%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
/* lighting effects on page switch: a light burst from the clicked tab, a sweeping beam, glowing cards and a pulsing active tab */
#lightfx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#lightfx::before,#lightfx::after{content:"";position:absolute;opacity:0}
#lightfx::before{inset:0;background:radial-gradient(circle at var(--fx-x,50%) 120px,color-mix(in srgb,var(--yellow) 55%,transparent) 0,color-mix(in srgb,var(--yellow) 18%,transparent) 22%,transparent 46%)}
#lightfx::after{top:-10%;bottom:-10%;left:-40%;width:35%;background:linear-gradient(100deg,transparent 0,color-mix(in srgb,var(--yellow) 22%,transparent) 40%,color-mix(in srgb,#fff 45%,transparent) 50%,color-mix(in srgb,var(--yellow) 22%,transparent) 60%,transparent 100%);transform:skewX(-14deg)}
#lightfx.run::before{animation:burst .9s ease-out}
#lightfx.run::after{animation:beam 1s cubic-bezier(.3,.6,.2,1)}
@keyframes burst{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes beam{0%{opacity:0;left:-40%}15%{opacity:1}85%{opacity:1}100%{opacity:0;left:110%}}
#app.go-r .c,#app.go-l .c,#app.go-f .c,#app.go-r .fact,#app.go-l .fact,#app.go-f .fact{animation:lit 1s ease-out both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes lit{0%{opacity:0;box-shadow:0 0 0 0 transparent}30%{opacity:1;box-shadow:0 0 22px 3px color-mix(in srgb,var(--yellow) 70%,transparent),0 0 0 1px var(--yellow)}100%{opacity:1;box-shadow:0 0 0 0 transparent}}
nav button[aria-selected=true]{animation:glow 1.1s ease-out}
@keyframes glow{0%{box-shadow:inset 0 -4px 0 var(--yellow),0 0 0 0 var(--yellow)}35%{box-shadow:inset 0 -4px 0 var(--yellow),0 0 26px 6px var(--yellow)}100%{box-shadow:inset 0 -4px 0 var(--yellow),0 0 0 0 transparent}}
/* map page: police car patrolling the map (decorative, ignores the mouse) */
.pcar{pointer-events:none}
.pcar .lr{animation:flr .5s steps(1) infinite}.pcar .lb{animation:flb .5s steps(1) infinite}
@keyframes flr{0%{opacity:1}50%{opacity:.15}}@keyframes flb{0%{opacity:.15}50%{opacity:1}}
.proute{fill:none;stroke:var(--red);stroke-width:1.4;stroke-dasharray:5 6;opacity:.55;pointer-events:none}
.pfig{pointer-events:none}.pfig text{font-family:var(--ui)}
.pring{fill:none;stroke:var(--red);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:pring 1.1s ease-out infinite}
@keyframes pring{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
.fpop{transform-box:fill-box;transform-origin:50% 100%;animation:fpop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes fpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(24deg)}}
.fbub{animation:fbub .4s .2s ease-out both}
@keyframes fbub{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* page-switch loaders: each page has its own animation */
#ldr{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg,#fff) 88%,transparent);backdrop-filter:blur(3px)}
#ldr.on{display:flex}#ldr .lc{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:22px 34px 18px;text-align:center;min-width:300px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#ldr svg{width:200px;height:134px;display:block;margin:0 auto 8px}#ldr b{display:block;font-size:18px}#ldr span.sub{font-size:13px;color:var(--mut)}
#ldr .pb{height:6px;background:var(--chip);border-radius:3px;margin-top:12px;overflow:hidden}#ldr .pb i{display:block;height:100%;background:var(--yellow);animation:lpb .7s linear both}
@keyframes lpb{from{width:0}to{width:100%}}
.lg1{transform-box:fill-box;transform-origin:50% 100%;animation:lgr .7s ease-in-out infinite alternate}@keyframes lgr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.lrw{animation:lsl .8s ease-out infinite}@keyframes lsl{0%{transform:translateX(-70px);opacity:0}40%,80%{transform:none;opacity:1}100%{opacity:0}}
.lsw{transform-box:view-box;transform-origin:60px 40px;animation:lsp 1.1s linear infinite}@keyframes lsp{to{transform:rotate(360deg)}}
.ldr-dash{stroke-dasharray:140;animation:ldd 1s ease-in-out infinite}@keyframes ldd{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.lpin{transform-box:fill-box;transform-origin:50% 100%;animation:lpn 1s ease-in infinite}@keyframes lpn{0%{transform:translateY(-30px);opacity:0}50%{transform:none;opacity:1}100%{opacity:1}}
.lmg{animation:lmv 1.2s ease-in-out infinite alternate}@keyframes lmv{0%{transform:translate(12px,10px)}33%{transform:translate(70px,14px)}66%{transform:translate(40px,44px)}100%{transform:translate(84px,40px)}}
.lkb{animation:lkn 1s ease-in-out infinite alternate}@keyframes lkn{from{transform:translateX(0)}to{transform:translateX(46px)}}
.lscan{animation:lsc .9s ease-in-out infinite alternate}@keyframes lsc{from{transform:translateY(0)}to{transform:translateY(50px)}}
.lgear{transform-box:fill-box;transform-origin:center;animation:lsp 2s linear infinite}.lgear.r{animation-direction:reverse}

/* animated cast: loading-screen guides + corner helper */
#ldr .lc{display:flex;gap:18px;align-items:flex-end;padding:20px 26px 18px;min-width:0;width:min(560px,92vw);text-align:left}
#ldr .chw{flex:none;width:170px;height:210px;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;transform:rotate(calc(var(--tilt,0)*1deg));transition:transform .25s ease-out;animation:chin .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes chin{from{transform:translateY(130%) rotate(0)}to{transform:none}}
.chb{border:0;background:none;padding:0;cursor:pointer;display:block}.chb:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:8px}
.chi{display:block;height:200px;width:auto;max-width:170px;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28))}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-6px) rotate(1.6deg)}}
.chi.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}@keyframes hop{0%{transform:scale(1,1)}25%{transform:scale(1.12,.86)}55%{transform:translateY(-26px) scale(.95,1.08)}80%{transform:scale(1.06,.94)}100%{transform:none}}
#ldr .lt{flex:1;min-width:0}#ldr .nm{font-size:13px;color:var(--mut)}#ldr .nm b{display:inline;font-size:15px;color:var(--ink)}
#ldr .bb{position:relative;margin:8px 0 6px;background:var(--chip);border:2px solid var(--ink);border-radius:12px;padding:11px 14px;font-size:15.5px;line-height:1.4;min-height:5.2em}
#ldr .bb::before{content:"";position:absolute;left:-10px;bottom:16px;border:8px solid transparent;border-right:10px solid var(--ink);border-left:0}
#ldr .hint{font-size:12px;color:var(--mut)}#ldr .lf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--mut)}
#ldr .bt.s{padding:4px 12px;font-size:12.5px}
@media(max-width:560px){#ldr .lc{flex-direction:column;align-items:center}#ldr .chw{height:150px}.chi{height:145px}#ldr .bb::before{display:none}}
#buddy{position:fixed;right:16px;bottom:10px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}#buddy[hidden]{display:none}
#buddy>*{pointer-events:auto}#buddy .chi{height:128px;animation-duration:3s}#buddy .bq{position:relative;width:min(250px,70vw);margin-bottom:12px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:bpop .35s cubic-bezier(.3,1.6,.5,1) both;transform-origin:90% 100%}
#buddy .bq::after{content:"";position:absolute;right:46px;bottom:-11px;border:8px solid transparent;border-top:10px solid var(--ink);border-bottom:0}
@keyframes bpop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#buddy .bx{position:absolute;top:-6px;left:-8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-size:11px;line-height:1;cursor:pointer;padding:0}
#buddy .wr{position:relative}
@media(max-width:700px){#buddy .chi{height:84px}}
@media print{#buddy{display:none}}
@media print{nav,.tools,header button,#lightfx{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

<script>
window.onerror=()=>{const a=document.getElementById('app');if(a&&/Loading data/.test(a.textContent))a.innerHTML='<div class="c amb"><h2>We couldn\'t load the data</h2><p>The embedded data failed to load. Rebuild the dashboard with <code>python build_dashboard.py</code> and reopen the file.</p></div>'};
const D=JSON.parse(document.getElementById('d').textContent),R=D.rows.slice().sort((a,b)=>a.rk-b.rk);
const N=n=>Number(n).toLocaleString('en-US'),S=s=>Number(s).toFixed(1);
const F=["Severity","Safety risk","Traffic impact","Incident frequency","Local context"],W=[.3,.25,.2,.15,.1];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const by={};R.forEach(r=>by[r.id]=r);const NESC=R.filter(r=>r.esc).length;
const unc=r=>r.unc!==undefined?r.unc:(r.esc&&r.gaps.some(g=>/resolution time/.test(g[0])));
const drv=r=>r.p.indexOf(Math.max(...r.p));
const lv=r=>r.cf>=70?'High':r.cf>=40?'Medium':'Low';
const tier=r=>r.esc?'<span class="b e">⚠ Immediate review</span>':'<span class="b">Ranked</span>';
const conf=r=>{const l=lv(r);return `<span class="b ${l[0].toLowerCase()}">${l=='High'?'●●●':l=='Medium'?'●●○':'●○○'} ${l}</span>`};
const link=r=>`<a href="#/loc/${r.id}">${r.id}</a>`;
const explain=r=>`Priority ${S(r.s)} = ${F.map((f,i)=>f.toLowerCase()+' '+S(r.p[i])).join(', ')}. Main reason: ${F[drv(r)].toLowerCase()}.`;
const TABS=[['overview','Overview'],['list','Priority list'],['map','Map'],['loc','Location'],['whatif','What-if'],['quality','Data quality'],['method','Method']];
let lastLoc=R[0].id;
const FL={q:'',z:'',rt:'',sc:'',cf:'',e:false,n:50};
// ---------- pages ----------
function overview(){
 const low=R.filter(r=>r.cf<40).length,mx=Math.max(...D.month),M='JFMAMJJASOND';
 const crit=R.filter(r=>r.why.some(w=>/Critical incident with injury/.test(w))).length,sens=R.filter(r=>r.esc&&(r.sc||r.ho)).length,unr=(D.q.find(f=>/Unresolved incident/.test(f.c))||{k:0}).k;
 const bars=D.month.map((v,i)=>{const h=v/mx*100;return `<rect x="${i*30+6}" y="${120-h}" width="22" height="${h}" rx="3" fill="var(--brand)"/><text x="${i*30+17}" y="${116-h}" font-size="9" text-anchor="middle" fill="currentColor">${N(v)}</text><text x="${i*30+17}" y="136" font-size="11" text-anchor="middle" fill="var(--mut)">${M[i]}</text>`}).join('');
 const top=R.filter(r=>r.esc).slice(0,5).map(r=>`<tr data-go="#/loc/${r.id}"><td class="r">${N(r.rk)}</td><td>${link(r)}</td><td class="r">${S(r.s)}</td><td>${F[drv(r)]}</td></tr>`).join('');
 app.innerHTML=`<section class="hero" aria-labelledby="hh"> <h2 id="hh"><span class="red">${N(NESC)}</span> of ${D.nL.toLocaleString('en-US')} locations need immediate review</h2>
 <p style="margin:0 0 16px;font-size:16px;max-width:62ch">Each one triggers a hard safety rule, so it ranks first whatever its priority score. Open any location to see exactly why.</p>
 <a class="cta" href="#/list" data-esc>Review the ${N(NESC)} locations</a>
 <div class="facts"><div class="fact"><b>${crit}</b>have an unresolved Critical incident with an injury.</div>
 <div class="fact"><b>${sens}</b>are near a school or hospital.</div>
 <div class="fact"><b>Verify on site</b>All ${unr.toLocaleString('en-US')} unresolved incidents still list a resolution time, so these are leads to inspect, not confirmed hazards.</div></div></section>
 <div class="g k">
 <div class="c"><div class="kv">${D.nL.toLocaleString('en-US')}</div><div class="kl">locations</div></div>
 <div class="c"><div class="kv">${D.nI.toLocaleString('en-US')}</div><div class="kl">incidents</div></div>
 <div class="c"><div class="kv">${D.nC.toLocaleString('en-US')}</div><div class="kl">complaints</div></div>
 <div class="c"><div class="kv red">${N(NESC)}</div><div class="kl">immediate-review locations</div></div>
 <div class="c"><div class="kv">${low}</div><div class="kl">locations with low data confidence</div></div></div>
 <div class="g two" style="margin-top:12px"><div class="c"><h3>Incidents per month (2025)</h3>
 <svg viewBox="0 0 360 142" width="100%" role="img" aria-label="Bar chart of incidents per month, between ${N(Math.min(...D.month))} and ${N(mx)}">${bars}</svg></div>
 <div class="c"><h3>Top 5 for immediate review</h3><div class="sc"><table style="min-width:0"><tr><th class="r">Rank</th><th>Location ID</th><th class="r">Priority score</th><th>Main reason</th></tr>${top}</table></div></div></div>
 <div class="c" style="margin-top:12px"><h3>How to read this</h3><p style="margin:0">The score ranks <b>current</b> priority; it does not forecast the future. Locations that trigger a safety rule rank first, even where a ranked location scores higher. Data confidence shows how much recorded evidence supports each rank.</p></div>`}
function listRows(){
 const q=FL.q.toLowerCase();
 return R.filter(r=>(!q||r.id.toLowerCase().includes(q))&&(!FL.z||r.z==FL.z)&&(!FL.rt||r.rt==FL.rt)&&(!FL.sc||(FL.sc=='sc'?r.sc:r.ho))&&(!FL.cf||lv(r)==FL.cf)&&(!FL.e||r.esc))}
function listBody(){
 const rows=listRows(),show=rows.slice(0,FL.n);let h='',prev=null;
 show.forEach(r=>{if(r.esc!==prev){h+=`<tr class="sep"><td colspan="9">${r.esc?'Immediate review: ranked first by safety rule':'Ranked by priority score'}</td></tr>`;prev=r.esc}
  h+=`<tr data-go="#/loc/${r.id}"><td class="r">${N(r.rk)}</td><td>${link(r)}</td><td>${esc(r.z)}</td><td>${tier(r)}</td><td class="r">${S(r.s)}</td><td>${F[drv(r)]}</td><td class="r">${N(r.n)}</td><td class="r">${N(r.oc)}</td><td>${conf(r)}</td></tr>`});
 $('#lb').innerHTML=h||'<tr><td colspan="9" style="padding:28px;text-align:center"><b>Nothing matches those filters</b><br><span class="mut">Try removing a filter, or search a different location ID such as L0556.</span><br><button class="bt s" id="fx2" style="margin-top:10px">Clear all filters</button></td></tr>';
 const fx2=$('#fx2');if(fx2)fx2.onclick=()=>$('#fx').click();
 $('#lc').textContent=`${N(rows.length)} of ${N(R.length)} shown`;$('#more').hidden=rows.length<=FL.n}
function list(){
 const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
 const zs=[...new Set(R.map(r=>r.z))].sort(),rts=[...new Set(R.map(r=>r.rt))].sort();
 app.innerHTML=`<h2>Priority list</h2><div class="c esc" style="margin-bottom:8px">Locations that trigger a safety rule rank first, even where a ranked location has a higher score. <b>Caveat:</b> every escalated location has a status caveat, because the recorded &ldquo;unresolved&rdquo; status can't be confirmed from the data (see Data quality).</div>
 <div class="tools"><input id="fq" placeholder="Search location ID" aria-label="Search by location ID" value="${esc(FL.q)}">
 <select id="fz" aria-label="Zone"><option value="">All zones</option>${opt(zs,FL.z)}</select>
 <select id="fr" aria-label="Road type"><option value="">All road types</option>${opt(rts,FL.rt)}</select>
 <select id="fs" aria-label="Sensitive site"><option value="">Any site</option><option value="sc" ${FL.sc=='sc'?'selected':''}>Near school</option><option value="ho" ${FL.sc=='ho'?'selected':''}>Near hospital</option></select>
 <select id="fc" aria-label="Data confidence"><option value="">Any data confidence</option>${opt(['High','Medium','Low'],FL.cf)}</select>
 <label><input type="checkbox" id="fe" ${FL.e?'checked':''}> Immediate review only</label>
 <button class="bt s" id="fx">Reset filters</button><button class="bt" id="csv">Download CSV</button></div>
 <p class="mut sm" id="lc" aria-live="polite"></p><div class="c sc"><table><thead><tr><th class="r">Rank</th><th>Location ID</th><th>Zone</th><th>Review level</th><th class="r">Priority score</th><th>Main reason</th><th class="r">Incidents</th><th class="r">Open complaints</th><th>Data confidence</th></tr></thead><tbody id="lb"></tbody></table></div>
 <p><button class="bt s" id="more">Show 50 more</button></p>`;
 const up=()=>{FL.q=$('#fq').value;FL.z=$('#fz').value;FL.rt=$('#fr').value;FL.sc=$('#fs').value;FL.cf=$('#fc').value;FL.e=$('#fe').checked;FL.n=50;listBody()};
 let t;$('#fq').oninput=()=>{clearTimeout(t);t=setTimeout(up,200)};
 ['fz','fr','fs','fc','fe'].forEach(i=>$('#'+i).onchange=up);
 $('#fx').onclick=()=>{Object.assign(FL,{q:'',z:'',rt:'',sc:'',cf:'',e:false,n:50});list()};
 $('#more').onclick=()=>{FL.n+=50;listBody()};
 $('#csv').onclick=()=>{const rows=listRows(),h='rank,location_id,zone,review_level,priority_score,main_reason,incidents,open_complaints,data_confidence';
  const csv=[h,...rows.map(r=>[r.rk,r.id,r.z,r.esc?'Immediate review':'Ranked',S(r.s),F[drv(r)],r.n,r.oc,r.cf].join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='citypriority-ai_filtered.csv';a.click()};
 listBody()}
function loc(id){
 const r=by[id]||by[lastLoc];
 if(!by[id]&&id){app.innerHTML=`<div class="c amb"><h2>We couldn't find that location</h2><p>There is no location "${esc(id)}". IDs look like L0556.</p><a class="cta" href="#/list">Back to the list</a></div>`;return}
 lastLoc=r.id;const i=R.indexOf(r),pv=R[i-1],nx=R[i+1];
 const bars=F.map((f,k)=>`<div class="bar"><span class="n">${f}</span><span class="t"><i style="width:${r.f[k]}%"></i></span><span class="v">${S(r.f[k])}/100 × ${W[k]*100}% = ${S(r.p[k])} pts</span></div>`).join('');
 const mx=Math.max(1,...r.ty),ty=D.types.map((t,k)=>`<div class="bar"><span class="n">${esc(t)}</span><span class="t"><i style="width:${r.ty[k]/mx*100}%"></i></span><span class="v">${N(r.ty[k])}</span></div>`).join('');
 app.innerHTML=`<div class="hd"><a href="#/list">← List</a><h2>${r.id}</h2><span class="mut">${esc(r.z)}</span>
 <span style="margin-left:auto">${pv?`<a href="#/loc/${pv.id}">‹ Previous</a>`:''} ${nx?`<a href="#/loc/${nx.id}">Next ›</a>`:''}</span></div>
 <div class="g k" style="margin-bottom:12px">
 <div class="c"><div class="kl">Rank</div><div class="kv">#${N(r.rk)}</div><div class="kl">of ${R.length.toLocaleString('en-US')} locations</div></div>
 <div class="c"><div class="kl">Priority score</div><div class="kv">${S(r.s)}</div><div class="kl">out of 100${r.esc?', rank set by safety rule':''}</div></div>
 <div class="c ${r.esc?'esc':''}"><div class="kl">Review level</div><div class="kv ${r.esc?'red':''}" style="font-size:22px;padding:5px 0">${r.esc?'⚠ Immediate review':'Ranked'}</div><div class="kl">${r.esc?'Safety rule triggered':'Ordered by priority score'}</div></div>
 <div class="c"><div class="kl">Data confidence</div><div class="kv" style="color:var(--${lv(r)=='High'?'ok':lv(r)=='Medium'?'warn':'mut'})">${lv(r)}</div><div class="kl">evidence score ${r.cf}/100</div></div></div>

 const k=Math.cos((minLa+maxLa)/2*Math.PI/180),L=46,T=14,P=10,PW=1040,u=(PW-2*P)/((maxLo-minLo)*k),PH=(maxLa-minLa)*u+2*P,VW=L+PW+14,VH=T+PH+30;

 function patrol(on){const tok=++pid,fig=$('#pfig'),ln=$('#pline'),st=$('#pst');fig.style.display='none';fig.innerHTML='';ln.setAttribute('d','');
  const q=on.filter(p=>p.r.esc).sort((a,b)=>a.r.rk-b.r.rk).slice(0,10);
  if(!q.length){st.textContent='Patrol car is waiting at base: no immediate-review locations in view.';return}
  if(still){const p=q[0];place(+p.x-16,+p.y,0);showFig(p);st.textContent=`Patrol car at ${p.r.id} (rank #${N(p.r.rk)}): ${fmt(p.r)}`;return}
  let i=0,leg=null,d=0,hold=0,last=performance.now();
  const start=()=>{const p=q[i%q.length],tx=+p.x,ty=+p.y,w=[{x:pos.x,y:pos.y},{x:tx,y:pos.y},{x:tx,y:ty}].filter((z,k,a)=>k==0||Math.hypot(z.x-a[k-1].x,z.y-a[k-1].y)>.5),L2=[];let tot=0;
   for(let k=1;k<w.length;k++){const l=Math.hypot(w[k].x-w[k-1].x,w[k].y-w[k-1].y);L2.push(l);tot+=l}
   leg={p,w,L2,tot};d=0;hold=0;fig.style.display='none';fig.innerHTML='';
   ln.setAttribute('d','M'+w.map(z=>z.x.toFixed(1)+' '+z.y.toFixed(1)).join('L'));
   st.textContent=`Patrol car heading to ${p.r.id} (rank #${N(p.r.rk)})…`;
   if(tot<1){showFig(p);st.textContent=`Patrol car at ${p.r.id}: ${fmt(p.r)}`}};
  const frame=t=>{const c=document.getElementById('pcar');if(tok!==pid||!c||!c.isConnected)return;const dt=Math.min((t-last)/1000||0,.05);last=t;
   if(d<leg.tot){d=Math.min(leg.tot,d+420*dt);let r=d,k=0;while(k<leg.L2.length-1&&r>leg.L2[k]){r-=leg.L2[k];k++}
    const a=leg.w[k],b=leg.w[k+1],f=leg.L2[k]?r/leg.L2[k]:1;place(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI);

 const nonE=R.filter(r=>!r.esc),base={};nonE.slice().sort((a,b)=>sc(b,W)-sc(a,W)).forEach((r,i)=>base[r.id]=i+1);
 const topSet=x=>new Set(R.slice().sort((a,b)=>sc(b,x)-sc(a,x)).slice(0,50).map(r=>r.id)),b50=topSet(W);
 const paint=()=>{F.forEach((_,i)=>{$('#w'+i).value=Math.round(w[i]*100);$('#wv'+i).textContent=Math.round(w[i]*100)+'%'});
  const n=nonE.map(r=>[r,sc(r,w)]).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const pl=(k,u)=>N(k)+' '+u+(k==1?'':'s'),mv=(d)=>d>0?'Moves up '+pl(d,'place'):d<0?'Moves down '+pl(-d,'place'):'Same place',

function quality(){
 app.innerHTML=`<h2>Data quality</h2><div class="g two">${D.q.map(f=>{const p=f.k/f.t*100;return `<div class="c ${f.lv=='critical'?'esc':'amb'}"><h3>${esc(f.c)} <span class="b ${f.lv=='critical'?'e':'m'}">${f.lv=='critical'?'⚠ Critical':'! Warning'}</span></h3><div class="kv">${f.k.toLocaleString('en-US')} <span class="kl">of ${f.t.toLocaleString('en-US')} (${p.toFixed(1)}%)</span></div><div class="bar"><span class="t"><i style="width:${p}%;background:var(--warn)"></i></span></div></div>`}).join('')}</div>
 <div class="c amb" style="margin-top:12px"><h3>What the two critical findings mean</h3><p style="margin:0">Every unresolved incident (2,874 of 2,874) and every open complaint (3,438 of 3,438) still carries a resolution time, so the resolution fields are never empty and cannot confirm whether work is finished. The percentages above are shares of <b>all</b> records. Escalations rely on the &ldquo;unresolved&rdquo; flag, so they are leads for on-site inspection, not confirmed open hazards.</p></div>
 <div class="c" style="margin-top:12px"><h3>Other findings</h3><ul style="margin:0;padding-left:18px"><li>Severity barely changes with injuries (mean 1.92 at 0 injuries vs 1.86 at 3), so labels carry little information.</li><li>Only one year of data (2025): no seasonal forecasting.</li><li>No repair-cost or traffic-count data; road type is used as a traffic proxy.</li></ul></div>
 <div class="c sc" style="margin-top:12px"><h3>Model check: can a model forecast Oct–Dec from Jan–Sep? (Poisson deviance, lower is better)</h3>
 <table style="min-width:0"><tr><th>Target</th><th class="r">Baseline (average)</th><th class="r">Poisson GLM</th><th class="r">Gradient boosting</th></tr>${VAL.map(v=>`<tr><td>${v[0]}</td><td class="r"><b>✓ ${v[1].toFixed(3)}</b></td><td class="r">${v[2].toFixed(3)}</td><td class="r">${v[3].toFixed(3)}</td></tr>`).join('')}</table>
 <p style="margin-bottom:0">No model beat the simple average, so we use transparent rules instead of a black-box model.</p></div>
 <div class="c" style="margin-top:12px"><h3>What this means for decisions</h3><ul style="margin:0;padding-left:18px"><li>Rely on injuries, not severity alone.</li><li>Verify resolution status on site before acting on escalations.</li><li>One year of data cannot support seasonal forecasts.</li></ul></div>`}

 app.innerHTML=`<h2>Method</h2><div class="g two">${F.map((f,i)=>`<div class="c"><h3>${f} (${W[i]*100}%) ${i==2?'<span class="b m">proxy</span>':''}</h3><p style="margin:0">${fd[i]}</p></div>`).join('')}</div>
 <div class="c esc" style="margin-top:12px"><h3>Safety escalation rules (override the score)</h3><ul style="margin:0;padding-left:18px"><li><b>R1</b> Unresolved Critical incident with injury.</li><li><b>R2</b> Unresolved High/Critical injury incident near a school/hospital with high pedestrian activity.</li><li><b>R3</b> Unresolved incidents at one location total 4+ injuries.</li></ul><p style="margin-bottom:0">Hard rules never use the weighted score, so the score cannot hide an urgent concern. ${NESC} locations are escalated; they always rank first.</p></div>
 <div class="c" style="margin-top:12px"><h3>Worked example: ${R[0].id}</h3><p style="margin:0">${explain(R[0])} Rule: ${esc(R[0].why.join('; '))}</p></div>
 <div class="c amb" style="margin-top:12px"><h3>Limitations</h3><ul style="margin:0;padding-left:18px"><li>Synthetic data: not a real city.</li><li>No repair-cost data; no traffic counts.</li><li>One year only. The score ranks current priority and does not forecast.</li><li>Every unresolved incident still lists a resolution time, so the unresolved status can't be confirmed; flagged sites need inspection.</li></ul></div>
 <p class="mut sm">Data: DATATHON 2026 organisers (locations, incidents, public complaints). Join key: location_id.</p>`}

const CAST={
 overview:{c:4,n:'Officer Sam',r:'Welcome guide',t:'Overview',l:()=>["Hi, I'm Officer Sam! Just getting the city totals ready for you…",`Did you know? ${N(NESC)} of ${N(R.length)} locations trip a hard safety rule.`,'Tip: click any row in the top-5 table to open that location.','Psst: the data is synthetic, so no real city was harmed.']},
 list:{c:5,n:'Officer Kiran',r:'Ranking desk',t:'Priority list',l:()=>[`Sorting ${N(R.length)} locations. Stand by…`,'Escalated locations always rank first, whatever their score.','Tip: search a location ID or use the filters to narrow the list.','You can download whatever you filtered with the Download CSV button.']},
 map:{c:2,n:'Officer Raj',r:'Patrol lead',t:'Map',l:()=>["Drawing the roads and dropping pins. Watch my patrol car go!",'Red dots need immediate review. Bigger, darker blue means a higher score.','Try the Near school filter to mark every school site.','Click any dot to open that location.']},
 loc:{c:3,n:'Meera',r:'Field officer',t:'Location',l:()=>['Pulling the location file…','Every location shows five factor scores that add up to its priority.','"What we can\'t tell you" lists the data gaps. Honesty first!','A red box means a safety rule fired for that place.']},
 whatif:{c:0,n:'Rita',r:'Engineer',t:'What-if',l:()=>['Warming up the weight sliders…','Drag a slider and the other four rebalance, so the weights always total 100%.','Escalated locations stay first however you set the weights.','Try Equal weights to see how sensitive the ranking is.']},
 quality:{c:1,n:'Mr. Dev',r:'Data inspector',t:'Data quality',l:()=>['Inspecting the data for cracks…','Two critical findings: records marked unresolved or open still carry resolution times.','Severity barely tracks injuries, so the safety rules use injuries directly.','Only one year of data, so there are no forecasting claims here.']},
 method:{c:0,n:'Rita',r:'Engineer',t:'Method',l:()=>['Opening the rulebook…','Five factors: severity 30%, safety risk 25%, traffic 20%, frequency 15%, context 10%.','Small samples are shrunk toward the city average so rankings are not noisy.','No model beat the simple average, so we keep the rules transparent.']}
};
let ldStop=()=>{},buddyOff=false,btm=[];
const hopEl=el=>{el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop')};
function typeInto(el,text,fast){clearInterval(el._t);if(RM||fast){el.textContent=text;return}el.textContent='';let i=0;el._t=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(el._t)},16)}
function showLoader(tab,done){
 ldStop();const k=CAST[tab],ls=k.l(),DUR=2600,ld=$('#ldr');let i=0,auto,fin;
 ld.innerHTML=`<div class="lc"><div class="chw" id="chw"><button class="chb" id="chb" aria-label="Tap ${esc(k.n)} for another message"><img class="chi" id="chi" src="${CH[k.c]}" alt="${esc(k.n)}, ${esc(k.r)}"></button></div><div class="lt"><div class="nm"><b>${esc(k.n)}</b> · ${esc(k.r)}</div><div class="bb" id="bb"></div><div class="hint">Tap ${esc(k.n.replace(/^(Officer|Mr\.) /,''))} for another tip</div><div class="pb"><i style="animation-duration:${DUR}ms"></i></div><div class="lf"><span>Loading ${esc(k.t)}…</span><button class="bt s" id="lsk">Skip ›</button></div></div></div>`;
 ld.classList.add('on');const bb=$('#bb'),im=$('#chi'),chw=$('#chw');
 const say=()=>{typeInto(bb,ls[i]);hopEl(im)};const nxt=()=>{i=(i+1)%ls.length;say();clearInterval(auto);auto=setInterval(nxt,2400)};
 const end=()=>{if(fin)return;fin=true;ldStop();done()};
 ldStop=()=>{clearInterval(auto);clearTimeout(ldStop.tm);document.removeEventListener('keydown',kd)};
 const kd=e=>{if(e.key=='Escape')end()};document.addEventListener('keydown',kd);
 $('#chb').onclick=nxt;$('#lsk').onclick=end;
 ld.onmousemove=e=>{const r=chw.getBoundingClientRect();chw.style.setProperty('--tilt',Math.max(-8,Math.min(8,(e.clientX-(r.left+r.width/2))/40)).toFixed(1))};
 say();auto=setInterval(nxt,2400);ldStop.tm=setTimeout(end,DUR)}
function buddy(tab){
 const b=$('#buddy');btm.forEach(clearTimeout);btm=[];if(buddyOff){b.hidden=true;return}
 const k=CAST[tab],tips=k.l().slice(1);let i=-1;
 b.hidden=false;b.innerHTML=`<div class="bq" id="bq" hidden></div><div class="wr"><button class="bx" id="bxx" aria-label="Hide helper">✕</button><button class="chb" id="bch" aria-label="Show another tip from ${esc(k.n)}"><img class="chi" id="bim" src="${CH[k.c]}" alt="${esc(k.n)}, ${esc(k.r)}"></button></div>`;
 const q=$('#bq'),tip=()=>{i=(i+1)%tips.length;q.hidden=false;q.style.animation='none';void q.offsetWidth;q.style.animation='';typeInto(q,tips[i]);hopEl($('#bim'));btm.forEach(clearTimeout);btm=[setTimeout(()=>{q.hidden=true},8000)]};
 $('#bch').onclick=tip;$('#bxx').onclick=()=>{buddyOff=true;b.hidden=true;btm.forEach(clearTimeout)};
 btm.push(setTimeout(tip,1300))}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let rtok=0;

let prevTab=-1;
const go=i=>{const a=$('#app'),n=$('#nav');a.classList.remove('go-r','go-l','go-f');n.classList.remove('run');void a.offsetWidth;a.classList.add(prevTab<0||i==prevTab?'go-f':i>prevTab?'go-r':'go-l');n.classList.add('run');a.querySelectorAll('.c,.fact').forEach((el,k)=>el.style.setProperty('--i',Math.min(k,14)));const sel=document.querySelector('#nav [aria-selected=true]'),fx=$('#lightfx');if(sel){const r=sel.getBoundingClientRect();fx.style.setProperty('--fx-x',(r.left+r.width/2)+'px')}fx.classList.remove('run');void fx.offsetWidth;fx.classList.add('run');prevTab=i};
function route(){
 const [,t='overview',a]=location.hash.split('/');const tab=TABS.some(x=>x[0]==t)?t:'overview';
 const hadFocus=!!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#nav'));
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k==tab}">${l}</button>`).join('');
 const idx=TABS.findIndex(x=>x[0]==tab),tok=++rtok,ld=$('#ldr');
 const draw=()=>{ldStop();ld.classList.remove('on');({overview,list,map,loc:()=>loc(a||lastLoc),whatif,quality,method})[tab]();go(idx);if(hadFocus)$('#nav [aria-selected=true]').focus();window.scrollTo(0,0);buddy(tab)};
 if(prevTab>=0&&idx!=prevTab&&!RM){showLoader(tab,()=>{if(tok===rtok)draw()})}else draw()}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)location.hash='#/'+b.dataset.t+(b.dataset.t=='loc'?'/'+lastLoc:'')};
$('#nav').onkeydown=e=>{const bs=[...document.querySelectorAll('#nav button')],i=bs.indexOf(document.activeElement);
 if(e.key=='ArrowRight'||e.key=='ArrowLeft'){const n=bs[(i+(e.key=='ArrowRight'?1:bs.length-1))%bs.length];n.focus();n.click()}};
app.onclick=e=>{if(e.target.closest('[data-esc]')){FL.e=true;FL.n=50}const r=e.target.closest('tr[data-go]');if(r&&!e.target.closest('a'))location.hash=r.dataset.go};
$('#th').onclick=()=>{const d=document.documentElement,dark=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';d.dataset.theme=dark?'light':'dark'};
addEventListener('hashchange',route);route();
</script></body></html>
